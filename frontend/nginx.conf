server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # ─── Headers de sécurité (P2 hardening) ──────────────────────────────
    # Anti clickjacking — doublé par CSP frame-ancestors 'none' ci-dessous.
    add_header X-Frame-Options "DENY" always;
    # Anti MIME-sniffing.
    add_header X-Content-Type-Options "nosniff" always;
    # Limite la fuite du Referer vers des origines tierces.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Verrouille les API navigateur sensibles (aucune n'est utilisée par l'app).
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    # CSP : 'unsafe-inline' reste requis car index.html embarque <script>/<style>
    # inline (SPA vanilla sans build). connect-src 'self' empêche néanmoins
    # l'exfiltration du JWT/ données vers un domaine attaquant via fetch/XHR.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # HSTS — ignoré par les navigateurs sur HTTP, honoré quand nginx sert du TLS
    # (prod réelle derrière un LB qui termine TLS → ce header reste correct).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # ──────────────────────────────────────────────────────────────────────

    # API : proxy vers le backend FastAPI.
    # P10-fix : upstream en variable + resolver Docker → nginx résout "backend" au runtime
    # (pas au config-load) → nginx -t passe même sans backend démarré (CI : docker compose run --no-deps).
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend_upstream http://backend:8000;

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # /docs et /openapi.json NE sont PAS exposés sur le frontend public en
    # production (anti-fuite de surface d'API). Le backend les garde sur :8000
    # pour le dev local ; le proxy nginx les masque côté :8080.

    # Frontend statique (SPA fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Compression
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
