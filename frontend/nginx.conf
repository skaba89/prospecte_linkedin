server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API : proxy vers le backend FastAPI
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Swagger/OpenAPI (optionnel)
        proxy_redirect off;
    }

    # Docs API (optionnel, si on veut exposer /docs)
    location /docs { proxy_pass http://backend:8000/docs; proxy_set_header Host $host; }
    location /openapi.json { proxy_pass http://backend:8000/openapi.json; proxy_set_header Host $host; }

    # Frontend statique (SPA fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Compression
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
