<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RevPulse Séquences</title>
<style>
  :root{--bg:#0a0e1a;--panel:#131826;--panel2:#1a2030;--border:#232a3d;--text:#e5e7eb;--muted:#8b95a8;
        --accent:#635bff;--accent2:#0a66c2;--ok:#10b981;--warn:#f59e0b;--err:#ef4444;--grad:linear-gradient(135deg,#635bff,#0a66c2)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
  a{color:var(--accent);text-decoration:none}
  .topbar{display:flex;align-items:center;gap:16px;padding:14px 24px;background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
  .topbar h1{font-size:18px;font-weight:700;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .topbar .sub{color:var(--muted);font-size:13px}
  .topbar .spacer{flex:1}
  .topbar a{font-size:13px;padding:6px 12px;border:1px solid var(--border);border-radius:8px}
  .topbar a:hover{background:var(--panel2)}
  .wrap{max-width:1000px;margin:0 auto;padding:24px}
  .login{max-width:360px;margin:80px auto;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:24px}
  .login h2{margin-bottom:12px;font-size:16px}
  .login input{width:100%;padding:10px;margin:6px 0;border:1px solid var(--border);border-radius:8px;background:var(--panel2);color:var(--text);font-size:14px}
  .login button{width:100%;padding:10px;margin-top:8px;background:var(--grad);color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;font-size:14px}
  .head{display:flex;align-items:center;gap:12px;margin-bottom:20px}
  .head h2{font-size:20px;flex:1}
  .btn{padding:8px 14px;background:var(--grad);color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;font-size:13px}
  .btn.sec{background:var(--panel2);border:1px solid var(--border)}
  .btn.danger{background:rgba(239,68,68,.15);color:var(--err);border:1px solid rgba(239,68,68,.3)}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:16px}
  .card h3{font-size:14px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .badge{display:inline-block;padding:2px 8px;border-radius:8px;font-size:11px;font-weight:600}
  .badge.draft{background:rgba(139,149,168,.15);color:var(--muted)}
  .badge.active{background:rgba(16,185,129,.15);color:var(--ok)}
  .badge.paused{background:rgba(245,158,11,.15);color:var(--warn)}
  .badge.completed{background:rgba(16,185,129,.15);color:var(--ok)}
  .badge.failed{background:rgba(239,68,68,.15);color:var(--err)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border)}
  th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  .empty{color:var(--muted);text-align:center;padding:18px;font-size:13px}
  input,select,textarea{width:100%;padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--panel2);color:var(--text);font-size:14px}
  textarea{resize:vertical;min-height:60px}
  label{font-size:12px;color:var(--muted);display:block;margin:8px 0 4px}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .row > *{flex:1;min-width:120px}
  .step-row{display:flex;gap:8px;align-items:center;margin-bottom:6px}
  .step-row select{flex:1}
  .step-row input{width:90px;flex:0 0 90px}
  .step-row .step-ord{width:28px;flex:0 0 28px;text-align:center;color:var(--muted);font-size:12px}
  .step-row button{flex:0 0 auto;padding:6px 10px;background:var(--panel2);border:1px solid var(--border);color:var(--err);border-radius:6px;cursor:pointer;font-size:12px}
  .seq-meta{font-size:12px;color:var(--muted);margin-bottom:8px}
  .seq-meta b{color:var(--text)}
  /* P72-fix : responsivité (était 0 media query → non-responsive sur mobile) */
  @media (max-width:900px){
    .topbar{flex-wrap:wrap;gap:8px;padding:12px 14px}
    .wrap{padding:16px}
    .head{flex-wrap:wrap;gap:8px}
    .head h2{font-size:16px}
  }
  @media (max-width:640px){
    .topbar h1{font-size:15px}
    .topbar .sub{display:none}
    .wrap{padding:12px}
    .head{flex-direction:column;align-items:flex-start}
    .card{padding:14px}
    .row{flex-direction:column;gap:6px}
    .row > *{min-width:0;width:100%}
    .step-row{flex-wrap:wrap;gap:6px}
    .step-row input{width:70px;flex:0 0 70px}
    .step-row select{flex:1 1 100%}
    .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
    table{min-width:480px}
  }
</style>
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="topbar">
  <h1>RevPulse Séquences</h1>
  <span class="sub" id="tenant-name"></span>
  <div class="spacer"></div>
  <a href="index.html">← Dashboard</a>
  <a href="crm.html">CRM</a>
  <a href="analytics.html">Analytics</a>
</div>

<div class="wrap" id="content" style="display:none">
  <div class="head">
    <h2>Séquences d'e-mails</h2>
    <button class="btn" onclick="showCreate()">+ Nouvelle séquence</button>
    <button class="btn sec" onclick="showTemplates()">📋 Templates</button>
  </div>
  <div id="seq-list"></div>

  <div id="create-form" class="card" style="display:none">
    <h3>Créer une séquence</h3>
    <label>Nom</label>
    <input id="sf-name" placeholder="Drip campaign Q1">
    <label>Description</label>
    <textarea id="sf-desc" placeholder="Séquence d'accueil prospect"></textarea>
    <label>Statut</label>
    <select id="sf-status"><option value="draft">Draft</option><option value="active">Active</option><option value="paused">Paused</option></select>
    <label>Étapes (template + délai jours)</label>
    <div id="sf-steps"></div>
    <div style="margin-top:8px"><button class="btn sec" onclick="addStep()">+ Ajouter une étape</button></div>
    <div style="margin-top:14px"><button class="btn" onclick="createSequence()">Créer</button> <button class="btn sec" onclick="document.getElementById('create-form').style.display='none'">Annuler</button></div>
  </div>

  <div id="tpl-gallery" class="card" style="display:none">
    <h3>📋 Bibliothèque de templates</h3>
    <div class="seq-meta">Démarrez vite : clonez un template curé en 1 clic, puis personnalisez-le. La séquence clonée est créée en statut <b>draft</b> (à activer manuellement).</div>
    <div id="tpl-list" style="margin-top:14px"></div>
    <div style="margin-top:14px"><button class="btn sec" onclick="hideTemplates()">Fermer</button></div>
  </div>

  <div id="detail" style="display:none"></div>
</div>

<div class="login" id="login" style="display:none">
  <h2>Connexion requise</h2>
  <input id="li-email" placeholder="email" value="demo@revpulse.io">
  <input id="li-pwd" type="password" placeholder="mot de passe" value="demo1234">
  <button onclick="doLogin()">Se connecter</button>
</div>

<script>
const API = (location.protocol === 'https:' ? 'https://' : 'http://') + location.host + '/api';
const TEMPLATES = [
  {id:'cold_outreach', label:'Cold outreach (premier contact)'},
  {id:'follow_up', label:'Follow-up (relance)'},
  {id:'intro', label:'Intro (présentation)'},
  {id:'re_engagement', label:'Ré-engagement (recontact)'},
];
let TOK = localStorage.getItem('revpulse_jwt');
let TID = null;
try { const s = JSON.parse(localStorage.getItem('revpulse_session') || '{}'); TID = s.activeTenantId; } catch(e){}
let _steps = [];

function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])) }
function fmtDate(iso){ if(!iso) return '—'; try { return new Date(iso).toLocaleString('fr-FR', {dateStyle:'short', timeStyle:'short'}); } catch(e){ return iso } }

async function api(method, path, body){
  const opts = {method, headers: {'Authorization': 'Bearer ' + TOK, 'Content-Type': 'application/json'}};
  if(body) opts.body = JSON.stringify(body);
  try { const r = await fetch(API + path, opts); let d; try { d = await r.json() } catch(e){ d = null } return {status: r.status, data: d}; }
  catch(e){ return {status: 0, data: null}; }
}

async function doLogin(){
  const r = await fetch(API + '/auth/login', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({email: document.getElementById('li-email').value, password: document.getElementById('li-pwd').value})});
  if(!r.ok){ alert('Login échoué'); return; }
  const d = await r.json();
  TOK = d.token; localStorage.setItem('revpulse_jwt', TOK);
  const ts = await fetch(API + '/tenants', {headers:{'Authorization':'Bearer '+TOK}});
  const tenants = await ts.json();
  TID = tenants[0]?.id;
  if(TID){ localStorage.setItem('revpulse_session', JSON.stringify({activeTenantId: TID})); init(); }
}

async function init(){
  if(!TOK || !TID){ document.getElementById('login').style.display='block'; return; }
  document.getElementById('login').style.display='none';
  document.getElementById('content').style.display='block';
  document.getElementById('tenant-name').textContent = '· ' + TID;
  await loadSequences();
}

async function loadSequences(){
  const {status, data} = await api('GET', '/tenants/' + TID + '/crm/sequences');
  if(status !== 200 || !data){ document.getElementById('seq-list').innerHTML = '<div class="card"><div class="empty">Erreur chargement séquences.</div></div>'; return; }
  if(!data.length){ document.getElementById('seq-list').innerHTML = '<div class="card"><div class="empty">Aucune séquence. Cliquez « + Nouvelle séquence ».</div></div>'; return; }
  document.getElementById('seq-list').innerHTML = data.map(s => `
    <div class="card">
      <h3>${esc(s.name)} <span class="badge ${s.status}">${esc(s.status)}</span></h3>
      <div class="seq-meta"><b>${s.steps.length}</b> étapes · <b>${s.enrollments_count}</b> enrollments${s.description ? ' · ' + esc(s.description) : ''}</div>
      <div class="rp-table-wrap"><table><thead><tr><th>#</th><th>Template</th><th class="num">Délai (j)</th></tr></thead>
        <tbody>${s.steps.map(st => `<tr><td>${st.step_order}</td><td>${esc(st.template_id)}</td><td class="num">${st.delay_days}</td></tr>`).join('')}</tbody></table></div>
      <div style="margin-top:12px"><button class="btn sec" onclick="showDetail('${s.id}')">Détail</button>
        <button class="btn sec" onclick="toggleStatus('${s.id}','${s.status==='active'?'paused':'active'}')">${s.status==='active'?'⏸ Pause':'▶ Activer'}</button>
        <button class="btn danger" onclick="deleteSeq('${s.id}','${esc(s.name)}')">Supprimer</button></div>
    </div>`).join('');
}

function showCreate(){
  document.getElementById('tpl-gallery').style.display = 'none';
  document.getElementById('create-form').style.display = 'block';
  _steps = [{template_id:'cold_outreach', delay_days:0}];
  renderSteps();
}

function addStep(){ _steps.push({template_id:'follow_up', delay_days:2}); renderSteps(); }

function renderSteps(){
  document.getElementById('sf-steps').innerHTML = _steps.map((st, i) => `
    <div class="step-row">
      <span class="step-ord">${i+1}</span>
      <select onchange="_steps[${i}].template_id=this.value">${TEMPLATES.map(t => `<option value="${t.id}" ${t.id===st.template_id?'selected':''}>${t.label}</option>`).join('')}</select>
      <input type="number" min="0" value="${st.delay_days}" onchange="_steps[${i}].delay_days=parseInt(this.value)||0" title="délai en jours">
      <button onclick="_steps.splice(${i},1);renderSteps()">✕</button>
    </div>`).join('');
}

async function createSequence(){
  const body = {
    name: document.getElementById('sf-name').value,
    description: document.getElementById('sf-desc').value,
    status: document.getElementById('sf-status').value,
    steps: _steps,
  };
  const {status, data} = await api('POST', '/tenants/' + TID + '/crm/sequences', body);
  if(status !== 201){ alert('Création échouée : ' + (data?.detail || status)); return; }
  document.getElementById('create-form').style.display = 'none';
  document.getElementById('sf-name').value = ''; document.getElementById('sf-desc').value = '';
  await loadSequences();
  showDetail(data.id);
}

// ─── P86 : templates de séquences réutilisables ──────────────────────────────
const TPL_CAT_LABELS = {prospection:'Prospection', onboarding:'Onboarding', 're-engagement':'Re-engagement', closing:'Closing'};

async function showTemplates(){
  document.getElementById('create-form').style.display = 'none';
  const el = document.getElementById('tpl-gallery');
  el.style.display = 'block';
  const list = document.getElementById('tpl-list');
  list.innerHTML = '<div class="empty">Chargement des templates…</div>';
  const {status, data} = await api('GET', '/tenants/' + TID + '/crm/sequences/templates');
  if(status !== 200 || !Array.isArray(data)){ list.innerHTML = '<div class="empty">Erreur chargement templates (statut ' + status + ').</div>'; return; }
  if(!data.length){ list.innerHTML = '<div class="empty">Aucun template disponible.</div>'; return; }
  list.innerHTML = data.map(t => `
    <div class="card" style="margin-bottom:12px">
      <h3>${esc(t.name)} <span class="badge" style="background:#1F4E78;color:#fff">${esc(TPL_CAT_LABELS[t.category]||t.category)}</span></h3>
      <div class="seq-meta"><b>${t.step_count}</b> étape${t.step_count>1?'s':''}</div>
      <div style="margin:6px 0;color:#555">${esc(t.description)}</div>
      <div class="rp-table-wrap"><table><thead><tr><th>#</th><th>Template</th><th class="num">Délai (j)</th></tr></thead>
        <tbody>${t.steps.map((st,i) => `<tr><td>${i+1}</td><td>${esc(st.template_id)}</td><td class="num">${st.delay_days}</td></tr>`).join('')}</tbody></table></div>
      <div style="margin-top:10px"><button class="btn" onclick="cloneTemplate('${t.id}','${esc(t.name)}')">⬇ Utiliser ce template</button></div>
    </div>`).join('');
}

function hideTemplates(){
  document.getElementById('tpl-gallery').style.display = 'none';
}

async function cloneTemplate(tplId, tplName){
  const name = prompt('Nom de la séquence clonée :', tplName);
  if(name === null){ return; }  // annulé
  const body = name ? {name} : {};
  const {status, data} = await api('POST', '/tenants/' + TID + '/crm/sequences/templates/' + tplId + '/clone', body);
  if(status !== 201){ alert('Clonage échoué : ' + (data?.detail || status)); return; }
  hideTemplates();
  await loadSequences();
  showDetail(data.id);
  RP.toast('Séquence « ' + (data.name||tplName) + ' » créée depuis le template (statut draft).', 'success');
}

async function toggleStatus(sid, newStatus){
  const {status} = await api('PATCH', '/tenants/' + TID + '/crm/sequences/' + sid, {status: newStatus});
  if(status !== 200){ alert('Maj échouée : ' + status); return; }
  await loadSequences();
}

async function deleteSeq(sid, name){
  if(!confirm('Supprimer la séquence « ' + name + ' » et tous ses enrollments ?')) return;
  const {status} = await api('DELETE', '/tenants/' + TID + '/crm/sequences/' + sid);
  if(status !== 200){ alert('Suppression échouée : ' + status); return; }
  await loadSequences();
}

async function showDetail(sid){
  const [seqR, enrR, stR] = await Promise.all([
    api('GET', '/tenants/' + TID + '/crm/sequences/' + sid),
    api('GET', '/tenants/' + TID + '/crm/sequences/' + sid + '/enrollments'),
    api('GET', '/tenants/' + TID + '/crm/sequences/' + sid + '/stats'),
  ]);
  if(seqR.status !== 200){ return; }
  const s = seqR.data, enrs = enrR.data || [], st = stR.data || {};
  document.getElementById('detail').style.display = 'block';
  document.getElementById('detail').innerHTML = `
    <div class="card">
      <h3>Détail : ${esc(s.name)} <span class="badge ${s.status}">${esc(s.status)}</span></h3>
      <div class="seq-meta">Stats : <b>${st.active||0}</b> active · <b>${st.completed||0}</b> completed · <b>${st.failed||0}</b> failed · <b>${st.total_enrollments||0}</b> total</div>
      <label>Enrôler un contact (ID)</label>
      <div class="row">
        <input id="enr-cid" placeholder="ctc_xxx">
        <button class="btn" onclick="enrollContact('${sid}')">Enrôler</button>
        <button class="btn sec" onclick="processNow('${sid}')">▶ Process now</button>
      </div>
      <label>Enrôler un segment (batch — P16, criteria appliqué)</label>
      <div class="row">
        <select id="enr-seg"><option value="">— Sélectionner un segment —</option></select>
        <button class="btn" onclick="enrollSegment('${sid}')">Enrôler le segment</button>
      </div>
      <h3 style="margin-top:16px">Enrollments (${enrs.length})</h3>
      ${enrs.length ? `<table><thead><tr><th>Contact</th><th>Step</th><th>Statut</th><th>Prochaine étape</th><th>Complété</th></tr></thead>
        <tbody>${enrs.map(e => `<tr><td>${esc(e.contact_id)}</td><td class="num">${e.current_step_order}</td>
          <td><span class="badge ${e.status}">${esc(e.status)}</span></td>
          <td>${fmtDate(e.next_step_at)}</td><td>${fmtDate(e.completed_at)}</td></tr>`).join('')}</tbody></table>` : '<div class="empty">Aucun enrollment.</div>'}
      <div style="margin-top:14px"><button class="btn sec" onclick="document.getElementById('detail').style.display='none'">← Retour à la liste</button></div>
    </div>`;
  loadSegmentsForEnroll();
}

async function enrollContact(sid){
  const cid = document.getElementById('enr-cid').value;
  if(!cid){ alert('Entrez un contact_id'); return; }
  const {status, data} = await api('POST', '/tenants/' + TID + '/crm/sequences/' + sid + '/enroll', {contact_id: cid});
  if(status === 409){ alert('Contact déjà enrôlé (active).'); return; }
  if(status !== 201){ alert('Enrollment échoué : ' + (data?.detail || status)); return; }
  showDetail(sid);
}

async function processNow(sid){
  const {status, data} = await api('POST', '/tenants/' + TID + '/crm/sequences/' + sid + '/process');
  if(status !== 200){ alert('Process échoué : ' + status); return; }
  alert('Passe scheduler : ' + (data.processed||0) + ' traité(s), ' + (data.sent||0) + ' envoyé(s), ' + (data.completed||0) + ' complété(s).');
  showDetail(sid);
}

async function loadSegmentsForEnroll(){
  const sel = document.getElementById('enr-seg');
  if(!sel) return;
  const {status, data} = await api('GET', '/tenants/' + TID + '/crm/segments');
  if(status !== 200 || !data){ sel.innerHTML = '<option value="">(erreur segments)</option>'; return; }
  sel.innerHTML = '<option value="">— Sélectionner un segment —</option>' +
    data.map(s => `<option value="${esc(s.id)}">${esc(s.name)} (${Object.keys(s.criteria||{}).length} critères)</option>`).join('');
}

async function enrollSegment(sid){
  const segId = document.getElementById('enr-seg').value;
  if(!segId){ alert('Sélectionnez un segment.'); return; }
  if(!confirm('Enrôler tous les contacts du segment dans cette séquence ?')) return;
  const {status, data} = await api('POST', '/tenants/' + TID + '/crm/sequences/' + sid + '/enroll-batch',
                                   {segment_id: segId});
  if(status !== 200){ alert('Batch enroll échoué : ' + (data?.detail || status)); return; }
  alert('Batch : ' + (data.enrolled||0) + ' enrôlé(s), ' + (data.skipped||0) + ' déjà actif(s) (total ' + (data.total||0) + ').');
  showDetail(sid);
}

init();
</script>
  <script src="assets/app.js"></script>
</body>
</html>
