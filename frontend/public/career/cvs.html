<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RevPulse Career — Mes CV</title>
<link rel="stylesheet" href="assets/career.css">
</head>
<body>
<div class="rp-layout">
  <aside class="rp-sidebar" data-rp-sidebar></aside>
  <div class="rp-backdrop"></div>
  <div class="rp-main">
    <header class="rp-topbar">
      <button class="rp-menu-btn" data-rp-menu>☰</button>
      <span class="rp-topbar-title" data-rp-topbar-title>Mes CV</span>
      <button class="rp-btn rp-btn-ghost rp-btn-sm" data-rp-logout>Déconnexion</button>
    </header>
    <main class="rp-content" id="rp-content">
      <div class="rp-loading">Chargement des CV…</div>
    </main>
  </div>
</div>
<script src="assets/career.js"></script>
<script>
(async function () {
  "use strict";
  if (!RP.requireAuth()) return;
  RP.bootstrap("cvs", "Mes CV");
  var c = document.getElementById("rp-content");
  await load();

  async function load() {
    var cvs = [];
    try { cvs = await RP.api("/api/career/cv"); } catch (e) { RP.toast(e.message, "error"); }
    c.innerHTML =
      '<h1>Mes CV</h1><p class="rp-muted">Importez votre CV (texte, PDF ou Word). Le parseur extrait compétences, expériences et certifications — sans rien inventer.</p>' +
      '<div class="rp-card"><div class="rp-card-header"><h3 class="rp-card-title">Importer un CV</h3></div>' +
      '<div class="rp-tabs" id="rp-import-tabs">' +
      '<button class="rp-tab active" data-im="text">Texte</button>' +
      '<button class="rp-tab" data-im="file">Fichier (PDF/Word)</button></div>' +
      '<form id="rp-text-form">' +
      '<div class="rp-form-row"><label class="rp-label">Titre du CV</label><input class="rp-input" name="title" required placeholder="CV Data Engineer 2026"></div>' +
      '<div class="rp-form-row"><label class="rp-label">Contenu du CV (texte brut)</label><textarea class="rp-textarea" name="raw_text" required style="min-height:160px" placeholder="Collez ici le texte intégral de votre CV…"></textarea></div>' +
      '<div class="rp-form-row"><label class="rp-label">Langue</label><select class="rp-select" name="locale"><option value="fr">Français</option><option value="en">English</option></select></div>' +
      '<button type="submit" class="rp-btn rp-btn-primary">Importer (texte)</button></form>' +
      '<form id="rp-file-form" style="display:none">' +
      '<div class="rp-form-row"><label class="rp-label">Titre du CV</label><input class="rp-input" name="title" required placeholder="CV Data Engineer 2026"></div>' +
      '<div class="rp-form-row"><label class="rp-label">Fichier PDF ou Word (.pdf, .docx)</label><input class="rp-input" type="file" name="file" accept=".pdf,.docx" required></div>' +
      '<div class="rp-form-row"><label class="rp-label">Langue</label><select class="rp-select" name="locale"><option value="fr">Français</option><option value="en">English</option></select></div>' +
      '<button type="submit" class="rp-btn rp-btn-primary">Importer (fichier)</button></form></div>' +

      '<div class="rp-card"><div class="rp-card-header"><h3 class="rp-card-title">CV enregistrés (' + cvs.length + ')</h3></div>' +
      (cvs.length ? renderList(cvs) : '<div class="rp-empty"><div class="rp-empty-icon">📄</div><div class="rp-empty-title">Aucun CV</div><p>Importez votre premier CV ci-dessus.</p></div>') +
      "</div>";

    // Tab switch
    c.querySelectorAll('[data-im]').forEach(function (t) {
      t.addEventListener("click", function () {
        c.querySelectorAll('[data-im]').forEach(function (x) { x.classList.remove("active"); });
        t.classList.add("active");
        var which = t.getAttribute("data-im");
        document.getElementById("rp-text-form").style.display = which === "text" ? "block" : "none";
        document.getElementById("rp-file-form").style.display = which === "file" ? "block" : "none";
      });
    });
    document.getElementById("rp-text-form").addEventListener("submit", function (e) { e.preventDefault(); submitText(this); });
    document.getElementById("rp-file-form").addEventListener("submit", function (e) { e.preventDefault(); submitFile(this); });
    c.querySelectorAll("[data-activate]").forEach(function (b) { b.addEventListener("click", function () { activate(b.dataset.activate); }); });
    c.querySelectorAll("[data-delete]").forEach(function (b) { b.addEventListener("click", function () { del(b.dataset.delete); }); });
    c.querySelectorAll("[data-transferrable]").forEach(function (b) { b.addEventListener("click", function () { showTransferrable(b.dataset.transferrable); }); });
  }

  function renderList(cvs) {
    var html = '<div class="rp-table-wrap"><table class="rp-table"><thead><tr><th>Titre</th><th>Compétences extraites</th><th>Exp. (ans)</th><th>Statut</th><th>Actions</th></tr></thead><tbody>';
    cvs.forEach(function (v) {
      var pd = v.parsed_data || {};
      var skills = (pd.skills || []).slice(0, 5).join(", ") || "—";
      var years = pd.years_experience != null ? pd.years_experience : "—";
      html += "<tr><td><strong>" + RP.esc(v.title) + "</strong><div class='rp-small rp-muted'>" + RP.esc(v.source_type) + " · " + RP.formatDate(v.created_at) + "</div></td>" +
        "<td class='rp-small'>" + RP.esc(skills) + "</td><td>" + RP.esc(years) + "</td>" +
        "<td>" + (v.is_active ? '<span class="rp-badge rp-badge-success">Actif</span>' : '<span class="rp-badge rp-badge-neutral">Inactif</span>') + "</td>" +
        '<td><div class="rp-btn-row">' +
        (v.is_active ? "" : '<button class="rp-btn rp-btn-secondary rp-btn-sm" data-activate="' + v.id + '">Activer</button>') +
        '<button class="rp-btn rp-btn-secondary rp-btn-sm" data-transferrable="' + v.id + '">Comp. transférables</button>' +
        '<button class="rp-btn rp-btn-ghost rp-btn-sm" data-delete="' + v.id + '">Supprimer</button>' +
        "</div></td></tr>";
    });
    html += "</tbody></table></div>";
    return html;
  }

  async function submitText(form) {
    var fd = new FormData(form);
    var body = { title: fd.get("title"), text: fd.get("raw_text"), locale: fd.get("locale") };
    var btn = form.querySelector("button[type=submit]"); btn.disabled = true; btn.textContent = "Import…";
    try { await RP.api("/api/career/cv/text", { method: "POST", body: body }); RP.toast("CV importé et analysé.", "success"); await load(); }
    catch (e) { RP.toast(e.message, "error"); btn.disabled = false; btn.textContent = "Importer (texte)"; }
  }
  async function submitFile(form) {
    var fd = new FormData(form);
    var file = fd.get("file");
    if (!file) return;
    var fd2 = new FormData();
    fd2.append("title", fd.get("title"));
    fd2.append("file", file);
    fd2.append("locale", fd.get("locale"));
    var btn = form.querySelector("button[type=submit]"); btn.disabled = true; btn.textContent = "Import…";
    var ext = file.name.split(".").pop().toLowerCase();
    var endpoint = ext === "pdf" ? "/api/career/cv/pdf" : "/api/career/cv/docx";
    try { await RP.api(endpoint, { method: "POST", form: fd2 }); RP.toast("CV importé et analysé.", "success"); await load(); }
    catch (e) { RP.toast(e.message, "error"); btn.disabled = false; btn.textContent = "Importer (fichier)"; }
  }
  async function activate(id) {
    try { await RP.api("/api/career/cv/" + id + "/activate", { method: "POST" }); RP.toast("CV activé.", "success"); await load(); }
    catch (e) { RP.toast(e.message, "error"); }
  }
  async function del(id) {
    if (!confirm("Supprimer ce CV ?")) return;
    try { await RP.api("/api/career/cv/" + id, { method: "DELETE" }); RP.toast("CV supprimé.", "success"); await load(); }
    catch (e) { RP.toast(e.message, "error"); }
  }
  async function showTransferrable(id) {
    try {
      var data = await RP.api("/api/career/cv/" + id + "/transferrable");
      var skills = (data && (data.transferrable_skills || data.skills)) || [];
      RP.toast("Compétences transférables : " + (skills.slice(0, 6).join(", ") || "aucune"), "success");
    } catch (e) { RP.toast(e.message, "error"); }
  }
})().catch(function (e) { document.getElementById("rp-content").innerHTML = '<div class="rp-card"><p>Erreur : ' + RP.esc(e.message) + '</p><a class="rp-btn rp-btn-secondary" href="dashboard.html">Retour</a></div>'; });
</script>
</body>
</html>
