<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RevPulse Career — Recherche d'emplois</title>
<link rel="stylesheet" href="assets/career.css">
</head>
<body>
<div class="rp-layout">
  <aside class="rp-sidebar" data-rp-sidebar></aside>
  <div class="rp-backdrop"></div>
  <div class="rp-main">
    <header class="rp-topbar">
      <button class="rp-menu-btn" data-rp-menu>☰</button>
      <span class="rp-topbar-title" data-rp-topbar-title>Recherche d'emplois</span>
      <button class="rp-btn rp-btn-ghost rp-btn-sm" data-rp-logout>Déconnexion</button>
    </header>
    <main class="rp-content" id="rp-content">
      <div class="rp-loading">Chargement…</div>
    </main>
  </div>
</div>
<script src="assets/career.js"></script>
<script>
(async function () {
  "use strict";
  if (!RP.requireAuth()) return;
  RP.bootstrap("search", "Recherche d'emplois");
  var c = document.getElementById("rp-content");
  var connectors = [], saved = [];
  try { connectors = await RP.api("/api/career/jobs/connectors"); } catch (e) {}
  try { saved = await RP.api("/api/career/saved-searches"); } catch (e) {}

  var connOpts = '<option value="">Tous les connecteurs</option>' +
    (connectors || []).map(function (x) { return '<option value="' + RP.esc(x.name) + '">' + RP.esc(x.name) + "</option>"; }).join("");
  var connBadges = '<div class="rp-pill-list">' + (connectors || []).map(function (x) {
    return '<span class="rp-tag">' + RP.esc(x.name) + " " + RP.connectorStatusBadge(x.status) + "</span>";
  }).join("") + "</div>";

  c.innerHTML =
    '<h1>Recherche d\'emplois</h1>' +
    '<p class="rp-muted">Recherchez across ' + (connectors.length) + ' connecteurs. Statuts : <strong>Actif</strong> = données réelles · <strong>Simulation</strong> = connecteur v1 (données simulées, v2 : API réelle).</p>' +
    '<div class="rp-card">' + connBadges + '</div>' +
    '<form id="rp-search-form"><div class="rp-card">' +
    '<div class="rp-card-header"><h3 class="rp-card-title">Critères de recherche</h3></div>' +
    '<div class="rp-grid rp-grid-2">' +
    '<div class="rp-form-row"><label class="rp-label">Mots-clés</label><input class="rp-input" name="keywords" placeholder="Data Engineer, Product Owner…"></div>' +
    '<div class="rp-form-row"><label class="rp-label">Localisation</label><input class="rp-input" name="location" placeholder="Paris, remote, Dakar…"></div>' +
    '<div class="rp-form-row"><label class="rp-label">Connecteur</label><select class="rp-select" name="source">' + connOpts + "</select></div>" +
    '<div class="rp-form-row"><label class="rp-label">Type de contrat</label><select class="rp-select" name="contract_type"><option value="">Tous</option><option>CDI</option><option>CDD</option><option>Freelance</option></select></div>' +
    '<div class="rp-form-row"><label class="rp-label">Salaire min</label><input class="rp-input" type="number" name="salary_min" min="0"></div>' +
    '<div class="rp-form-row"><label class="rp-label">Salaire max</label><input class="rp-input" type="number" name="salary_max" min="0"></div>' +
    "</div>" +
    '<div class="rp-btn-row"><button type="submit" class="rp-btn rp-btn-primary">Rechercher</button>' +
    '<button type="button" id="rp-save-btn" class="rp-btn rp-btn-secondary">Sauvegarder cette recherche</button></div>' +
    "</div></form>" +
    '<div id="rp-results"></div>' +
    '<div class="rp-card"><div class="rp-card-header"><h3 class="rp-card-title">Recherches sauvegardées (' + saved.length + ')</h3></div>' +
    (saved.length ? renderSaved(saved) : '<div class="rp-empty"><div class="rp-empty-icon">💾</div><div class="rp-empty-title">Aucune recherche sauvegardée</div><p>Sauvegardez vos critères pour relancer la recherche ultérieurement.</p></div>') +
    "</div>";

  document.getElementById("rp-search-form").addEventListener("submit", function (e) { e.preventDefault(); doSearch(); });
  document.getElementById("rp-save-btn").addEventListener("click", saveSearch);
  c.querySelectorAll("[data-run]").forEach(function (b) { b.addEventListener("click", function () { runSaved(b.dataset.run); }); });
  c.querySelectorAll("[data-delsearch]").forEach(function (b) { b.addEventListener("click", function () { delSearch(b.dataset.delsearch); }); });

  // Auto-load cached postings on first visit
  doSearch();

  function buildQuery() {
    var fd = new FormData(document.getElementById("rp-search-form"));
    var p = new URLSearchParams();
    if (fd.get("keywords")) p.set("keywords", fd.get("keywords"));
    if (fd.get("location")) p.set("location", fd.get("location"));
    if (fd.get("source")) p.set("source", fd.get("source"));
    p.set("limit", "50");
    return { fd: fd, qs: p.toString() };
  }
  async function doSearch() {
    var r = document.getElementById("rp-results");
    r.innerHTML = '<div class="rp-loading">Recherche en cours…</div>';
    var o = buildQuery();
    var live = [], cached = [];
    // Live search across connectors
    try {
      var lp = new URLSearchParams(); if (o.fd.get("keywords")) lp.set("q", o.fd.get("keywords"));
      if (o.fd.get("source")) lp.set("source", o.fd.get("source")); lp.set("limit", "50");
      live = await RP.api("/api/career/jobs/search?" + lp.toString());
    } catch (e) { /* v1 stubs may return empty */ }
    // Cached postings (always returns persisted data)
    try { cached = await RP.api("/api/career/jobs/postings?" + o.qs); } catch (e) {}

    var all = {};
    (cached || []).forEach(function (p) { all[p.id] = p; });
    (live || []).forEach(function (p) { if (p.id && !all[p.id]) all[p.id] = p; });
    var list = Object.values(all);
    r.innerHTML = '<div class="rp-card"><div class="rp-card-header"><h3 class="rp-card-title">' + list.length + ' offre(s) trouvée(s)</h3>' +
      '<span class="rp-small rp-muted">' + (cached.length) + ' en cache · ' + (live.length) + ' live</span></div>' +
      (list.length ? renderResults(list) : '<div class="rp-empty"><div class="rp-empty-icon">🔍</div><div class="rp-empty-title">Aucune offre</div><p>Ajustez vos critères ou élargissez la recherche à tous les connecteurs.</p></div>') +
      "</div>";
    r.querySelectorAll("[data-match]").forEach(function (b) { b.addEventListener("click", function () { window.location.href = "matching.html?posting=" + b.dataset.match; }); });
    r.querySelectorAll("[data-apply]").forEach(function (b) { b.addEventListener("click", function () { applyTo(b.dataset.apply, b.dataset.title, b.dataset.company); }); });
  }
  function renderResults(list) {
    var html = '<div class="rp-table-wrap"><table class="rp-table"><thead><tr><th>Poste</th><th>Entreprise</th><th>Lieu</th><th>Contrat</th><th>Salaire</th><th>Source</th><th>Actions</th></tr></thead><tbody>';
    list.forEach(function (p) {
      var sal = (p.salary_min || p.salary_max) ? RP.euros(p.salary_min) + "–" + RP.euros(p.salary_max) : "—";
      html += "<tr><td><strong>" + RP.esc(p.title) + "</strong>" + (p.url ? '<div class="rp-small"><a href="' + RP.esc(p.url) + '" target="_blank" rel="noopener">Lien offre ↗</a></div>' : "") + "</td>" +
        "<td>" + RP.esc(p.company || "—") + "</td><td>" + RP.esc(p.location || "—") + "</td>" +
        "<td>" + (p.contract_type ? '<span class="rp-badge rp-badge-neutral">' + RP.esc(p.contract_type) + "</span>" : "—") + "</td>" +
        '<td class="rp-small">' + RP.esc(sal) + "</td><td>" + RP.esc(p.source_connector || "—") + "</td>" +
        '<td><div class="rp-btn-row"><button class="rp-btn rp-btn-secondary rp-btn-sm" data-match="' + p.id + '">Match</button>' +
        '<button class="rp-btn rp-btn-primary rp-btn-sm" data-apply="' + p.id + '" data-title="' + RP.esc(p.title) + '" data-company="' + RP.esc(p.company || "") + '">Candidater</button></div></td></tr>';
    });
    html += "</tbody></table></div>";
    return html;
  }
  function renderSaved(saved) {
    var html = '<div class="rp-table-wrap"><table class="rp-table"><thead><tr><th>Nom</th><th>Critères</th><th>Alerte</th><th>Actions</th></tr></thead><tbody>';
    saved.forEach(function (s) {
      var cr = s.criteria || {};
      var critTxt = [cr.keywords, cr.location, (cr.contract_types || []).join(",")].filter(Boolean).join(" · ") || "—";
      html += "<tr><td><strong>" + RP.esc(s.name) + "</strong></td><td class='rp-small'>" + RP.esc(critTxt) + "</td>" +
        "<td>" + (s.alert_enabled ? '<span class="rp-badge rp-badge-success">' + RP.esc(s.alert_frequency) + "</span>" : '<span class="rp-badge rp-badge-neutral">Off</span>') + "</td>" +
        '<td><div class="rp-btn-row"><button class="rp-btn rp-btn-secondary rp-btn-sm" data-run="' + s.id + '">Relancer</button>' +
        '<button class="rp-btn rp-btn-ghost rp-btn-sm" data-delsearch="' + s.id + '">Supprimer</button></div></td></tr>';
    });
    html += "</tbody></table></div>";
    return html;
  }
  async function saveSearch() {
    var fd = new FormData(document.getElementById("rp-search-form"));
    var name = prompt("Nom de la recherche sauvegardée :", (fd.get("keywords") || "Recherche") + " " + (fd.get("location") || ""));
    if (!name) return;
    var body = {
      name: name,
      criteria: {
        keywords: fd.get("keywords") || null, location: fd.get("location") || null,
        contract_types: fd.get("contract_type") ? [fd.get("contract_type")] : null,
        salary_min: fd.get("salary_min") ? Number(fd.get("salary_min")) : null,
        salary_max: fd.get("salary_max") ? Number(fd.get("salary_max")) : null,
        source_connectors: fd.get("source") ? [fd.get("source")] : null
      },
      alert_enabled: false, alert_frequency: "daily"
    };
    try { await RP.api("/api/career/saved-searches", { method: "POST", body: body }); RP.toast("Recherche sauvegardée.", "success"); location.reload(); }
    catch (e) { RP.toast(e.message, "error"); }
  }
  async function runSaved(id) {
    try {
      var res = await RP.api("/api/career/saved-searches/" + id + "/run", { method: "POST" });
      RP.toast("Recherche relancée : " + (Array.isArray(res) ? res.length : 0) + " offre(s).", "success");
      doSearch();
    } catch (e) { RP.toast(e.message, "error"); }
  }
  async function delSearch(id) {
    if (!confirm("Supprimer cette recherche ?")) return;
    try { await RP.api("/api/career/saved-searches/" + id, { method: "DELETE" }); RP.toast("Supprimé.", "success"); location.reload(); }
    catch (e) { RP.toast(e.message, "error"); }
  }
  async function applyTo(postingId, title, company) {
    // Pre-fill application via query params to applications.html
    window.location.href = "applications.html?posting=" + encodeURIComponent(postingId) + "&title=" + encodeURIComponent(title) + "&company=" + encodeURIComponent(company || "");
  }
})().catch(function (e) { document.getElementById("rp-content").innerHTML = '<div class="rp-card"><p>Erreur : ' + RP.esc(e.message) + '</p><a class="rp-btn rp-btn-secondary" href="dashboard.html">Retour</a></div>'; });
</script>
</body>
</html>
