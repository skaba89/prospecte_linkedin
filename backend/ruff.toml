# Configuration ruff pour le backend RevPulse.
# Lint ciblé et déterministe (le default de ruff 0.17 est trop permissif/instable).

target-version = "py312"
line-length = 120
extend-exclude = ["seed_data.json"]

[lint]
# Jeu de règles cohérent : erreurs, warnings, imports, upgrade syntaxe,
# bugbear, comprehensions, ruff-specific.
select = ["E", "F", "W", "I", "UP", "B", "C4", "RUF"]
ignore = [
  "B008",   # function-call-in-default-argument — idiome FastAPI (Depends()/Query()/Path() en défaut d'arg)
  "E501",   # longueur de ligne — géré par le formatter, non bloquant
]

[lint.per-file-ignores]
"seed.py" = ["E402"]   # imports tardifs intentionnels (json/os au plus près de l'usage)
