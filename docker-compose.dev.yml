# docker-compose.dev.yml — override DÉVELOPPEMENT (hot-reload).
# Fusionné avec docker-compose.yml : `docker compose -f docker-compose.yml -f docker-compose.dev.yml up`
# ou simplement : `make dev`
#
# - backend : uvicorn --reload + code source monté (édition Python → rechargement auto)
# - frontend : public/ monté en lecture seule (édition de index.html → servi immédiatement par nginx)
# - db : héritée du compose de base (Postgres + volume persistant)

services:
  backend:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app
    volumes:
      - ./backend/app:/app/app
    environment:
      REVPULSE_FRONTEND_DIR: /nonexistent
      REVPULSE_ENV: development
      REVPULSE_JWT_SECRET: ${REVPULSE_JWT_SECRET:-dev-secret-not-for-prod}
      REVPULSE_DATABASE_URL: postgresql+psycopg2://revpulse:revpulse@db:5432/revpulse

  frontend:
    volumes:
      - ./frontend/public:/usr/share/nginx/html:ro
