  test-pg:
    name: API tests (PostgreSQL 16 réel, P10.14)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: revpulse
          POSTGRES_PASSWORD: revpulse-test
          POSTGRES_DB: revpulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U revpulse -d revpulse"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend deps
        run: pip install -r backend/requirements.txt
      - name: Start API (PostgreSQL 16, background)
        working-directory: backend
        run: |
          REVPULSE_ENV=test \
          WEBHOOK_SSRF_ALLOW_PRIVATE=true \
          REVPULSE_DATABASE_URL="postgresql+psycopg2://revpulse:revpulse-test@localhost:5432/revpulse" \
          REVPULSE_FRONTEND_DIR=/nonexistent \
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 --log-level warning &
          echo $! > /tmp/uvicorn.pid
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:8000/api/health && echo " -> healthy (PG 16)" && exit 0
            sleep 1
          done
          echo "API never became healthy on PG 16"; exit 1
      - name: Run API tests (against PostgreSQL 16)
        run: python tests/test_api.py
        env:
          BACKEND_URL: http://127.0.0.1:8000
      - name: Stop API
        if: always()
        run: kill $(cat /tmp/uvicorn.pid) 2>/dev/null || true

  audit:
    name: Dependency audit (pip-audit --strict, P10.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit strict (.audit-ignore honored — SECURITY.md)
        run: bash scripts/audit_deps.sh --strict

  docker:
    name: Docker (compose validate + build + nginx -t + backup round-trip, P10.15)
    runs-on: ubuntu-latest
    # P10.5 : vars :? (fail-fast prod) — valeurs dummy pour la substitution compose en CI
    # (le job ne démarre pas le backend ; ces valeurs ne sont jamais utilisées à l'exécution).
    env:
      POSTGRES_PASSWORD: ci-validate-dummy
      REVPULSE_JWT_SECRET: ci-validate-dummy-secret-at-least-32-chars-long
      REVPULSE_TOKEN_ENCRYPTION_KEY: ci-validate-dummy
      GRAFANA_ADMIN_PASSWORD: ci-validate-dummy
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q
      - name: Build images
        run: docker compose build
      - name: nginx config syntax check (dans l'image frontend construite)
        run: docker compose run --no-deps --rm frontend nginx -t
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend deps (pour alembic dans le round-trip)
        run: pip install -r backend/requirements.txt
      - name: Backup round-trip E2E (postgres éphémère, P10.15)
        run: make backup-test
