name: CI

on:
  push:
    branches: [main, master]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'tests/**'
      - 'docker-compose*.yml'
      - 'Makefile'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'tests/**'
      - 'docker-compose*.yml'
      - 'Makefile'
      - '.github/workflows/ci.yml'

# Annule les runs obsolètes sur la même branche
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff==0.17.5
      - run: ruff check backend/app

  frontend:
    name: Static checks (frontend + observability + backups + security + CRM P11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyYAML (for test_observability)
        run: pip install pyyaml
      - name: Static security checks (headers nginx, CSP, non-root, esc, no eval, 401)
        run: python tests/test_frontend.py
      - name: P31 Career frontend (7 pages + design system + JS syntax + endpoints wiring)
        run: python tests/test_p31_frontend.py
      - name: Observability configs (Grafana dashboard + Prometheus alerts + scrape, P7)
        run: python tests/test_observability.py
      - name: Backup/restore scripts (pg_dump --clean, rotation, round-trip, P8)
        run: python tests/test_backups.py
      - name: Security static checks (secrets scan + bcrypt + env-driven config, P9)
        run: python tests/test_security.py
      - name: P10 critical security corrections (health/crypto/state/dedup/CI, static)
        run: python tests/test_p10_security.py
      - name: P11 CRM static checks (models/migration/schemas/router/RBAC/dedup/score)
        run: python tests/test_crm.py
      - name: P12 LinkedIn sync static checks (client/sync/dedup/RBAC/retry)
        run: python tests/test_linkedin.py
      - name: P13 Notifications & e-mails static checks (model/migration/mailer/templates/RBAC/RGPD)
        run: python tests/test_notifications.py
      - name: P14 Analytics & reporting static checks (overview/pipeline/emails/sources/export/RBAC)
        run: python tests/test_analytics.py
      - name: P15 Séquences & automatisation static checks (scheduler/enroll/process/stats/RBAC)
        run: python tests/test_sequences.py
      - name: P16 Ciblage avancé + batch enrollment static checks (has_email/no_email_days/enrolled_in_sequence/enroll-batch)
        run: python tests/test_segments_dyn.py
      - name: P17 Scoring avancé static checks (engagement+decay+opportunity, hook notifications, batch recompute)
        run: python tests/test_scoring.py
      - name: P18 Webhooks outbound static checks (models/service/router/hooks HMAC/retry/RBAC audit)
        run: python tests/test_webhooks.py
      - name: P19 Webhook retry cron static checks (start_scheduler threading daemon/env gate/deliver_pending)
        run: python tests/test_webhook_retry_cron.py
      - name: P20 Webhooks inbound static checks (InboundWebhook model/service/router public POST/CRUD/dedup/migration)
        run: python tests/test_inbound_webhooks.py
      - name: P21 Audit & compliance UI static checks (filtres/stats/export CSV + frontend audit.html)
        run: python tests/test_audit_ui.py
      - name: P22 Tags & catégorisation static checks (Tag/ContactTag models + router CRUD/assign + filtre crm + migration)
        run: python tests/test_tags.py
      - name: P23 Tasks & reminders static checks (Task étendu reminder_at/completed_at + scheduler + filtres + migration)
        run: python tests/test_tasks.py
      - name: P24 Analytics v2 static checks (funnel conversion + cohorts par mois + attribution revenue + Opportunity.closed_at + migration)
        run: python tests/test_analytics_v2.py
      - name: P24-A Sécurisation résiduelle (SSRF webhooks + secret chiffré + idempotence inbound + IDOR fix + dry_run exclu scoring + lock FOR UPDATE + migration)
        run: python tests/test_p24a_security.py
      - name: P24-B AI Gateway multi-provider (7 providers + Simulated + fallback + quota + PII + injection + prompts versionnés + migration)
        run: python tests/test_p24b_ai.py
      - name: P25 Agents IA spécialisés + AI Copilot (10 agents CRM-connected + Copilot routing + AgentRun historisation + migration)
        run: python tests/test_p25_agents.py
      - name: P26 LinkedIn Content Studio (posts + templates + carousel + calendar + stats + validation collaborative + migration)
        run: python tests/test_p26_content.py
      - name: P27 Prospection avancée (multicanal sequences + A/B testing + intent signals + enrichment + migration)
        run: python tests/test_p27_prospecting.py
      - name: P28 Warmup inbox + Sales Intelligence (warmup ramp + funnel + cohorts + forecast + migration)
        run: python tests/test_p28_sales_intel.py
      - name: P32 Sécurité & production (PyJWT migration + SSRF AI base_url + prod hardening)
        run: python tests/test_p32_security.py
      - name: P34 Career référentiel métiers + CV (import text/PDF/Word + parse + transferrable + isolation)
        run: python tests/test_p34_career.py
      - name: P35 Career recherche opportunités (connecteurs 12 providers + dedup + expired + saved searches)
        run: python tests/test_p35_job_search.py
      - name: P36 Career matching intelligent (score hybride 6 critères + missing skills + eliminatory + disclaimer)
        run: python tests/test_p36_matching.py
      - name: P37 Career CV adaptatif (versions ciblées par offre + anti-invention + PDF/Word)
        run: python tests/test_p37_cv_adaptatif.py
      - name: P38 Career candidatures + Gmail/Outlook (pipeline + cover letter anti-invention + anti-spam)
        run: python tests/test_p38_candidatures.py
      - name: P40 Career notifications intelligentes (modèle + service anti-spam + hooks matching/applications)
        run: python tests/test_p40_notifications.py
      - name: P41 Career coach IA entretiens (questions par métier + analyze_answer anti-invention + formations)
        run: python tests/test_p41_coach.py
      - name: P43 Career analytics (KPIs agrégés anti-invention + performance plateforme/CV + salary trends)
        run: python tests/test_p43_analytics.py
      - name: P42 Career agent autonome (10 étapes + consent + limit + stop + rapport)
        run: python tests/test_p42_agent.py

  test-api:
    name: API tests (sqlite, sans docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend deps
        run: pip install -r backend/requirements.txt
      - name: Config unit tests (JWT fail-fast)
        run: python tests/test_config.py
      - name: Validate Alembic migrations (up → down → up)
        working-directory: backend
        run: |
          rm -f migrate_test.db
          REVPULSE_DATABASE_URL="sqlite:///./migrate_test.db" alembic upgrade head
          REVPULSE_DATABASE_URL="sqlite:///./migrate_test.db" alembic downgrade base
          REVPULSE_DATABASE_URL="sqlite:///./migrate_test.db" alembic upgrade head
          rm -f migrate_test.db
      - name: Start API (sqlite, background)
        working-directory: backend
        run: |
          REVPULSE_ENV=test WEBHOOK_SSRF_ALLOW_PRIVATE=true REVPULSE_DATABASE_URL="sqlite:///./ci.db" REVPULSE_FRONTEND_DIR=../frontend/public \
            python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 --log-level warning &
          echo $! > /tmp/uvicorn.pid
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/health && echo " -> healthy" && exit 0
            sleep 1
          done
          echo "API never became healthy"; exit 1
      - name: Run API tests
        run: python tests/test_api.py
        env:
          BACKEND_URL: http://127.0.0.1:8000
      - name: P30 Commercialisation (abonnements + quotas IA + checkout Stripe mock + devises)
        run: python tests/test_p30_billing.py
        env:
          REVPULSE_DATABASE_URL: sqlite:///./p30_test.db
          REVPULSE_ENV: test
      - name: P35-V2 France Travail connecteur réel (OAuth + API v2 + mapping + fallbacks, mock HTTP)
        run: python tests/test_p35_v2_connecteurs.py
        env:
          REVPULSE_ENV: test
      - name: P38-V2 OAuth Gmail (authorization code flow + refresh + Gmail API send + fallbacks, mock HTTP)
        run: python tests/test_p38_v2_email_oauth.py
        env:
          REVPULSE_DATABASE_URL: sqlite:///./revpulse_p38_test.db
