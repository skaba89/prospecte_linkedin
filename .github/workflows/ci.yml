name: CI

on:
  push:
    branches: [main, master]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'tests/**'
      - 'docker-compose*.yml'
      - 'Makefile'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'tests/**'
      - 'docker-compose*.yml'
      - 'Makefile'
      - '.github/workflows/ci.yml'

# Annule les runs obsolètes sur la même branche
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff==0.17.5
      - run: ruff check backend/app

  frontend:
    name: Frontend security (static checks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static security checks (headers nginx, CSP, non-root, esc, no eval, 401)
        run: python tests/test_frontend.py

  test-api:
    name: API tests (sqlite, sans docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend deps
        run: pip install -r backend/requirements.txt
      - name: Config unit tests (JWT fail-fast)
        run: python tests/test_config.py
      - name: Validate Alembic migrations (up → down → up)
        working-directory: backend
        run: |
          rm -f migrate_test.db
          REVPULSE_DATABASE_URL="sqlite:///./migrate_test.db" alembic upgrade head
          REVPULSE_DATABASE_URL="sqlite:///./migrate_test.db" alembic downgrade base
          REVPULSE_DATABASE_URL="sqlite:///./migrate_test.db" alembic upgrade head
          rm -f migrate_test.db
      - name: Start API (sqlite, background)
        working-directory: backend
        run: |
          REVPULSE_ENV=test REVPULSE_DATABASE_URL="sqlite:///./ci.db" REVPULSE_FRONTEND_DIR=/nonexistent \
            python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 --log-level warning &
          echo $! > /tmp/uvicorn.pid
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/health && echo " -> healthy" && exit 0
            sleep 1
          done
          echo "API never became healthy"; exit 1
      - name: Run API tests
        run: python tests/test_api.py
        env:
          BACKEND_URL: http://127.0.0.1:8000
      - name: Run P3 tests (pagination + request-ID + health)
        run: python tests/test_p3.py
        env:
          BACKEND_URL: http://127.0.0.1:8000
      - name: Run P4 tests (audit log)
        run: python tests/test_audit.py
        env:
          BACKEND_URL: http://127.0.0.1:8000
      - name: Run P5 tests (Prometheus metrics)
        run: python tests/test_metrics.py
        env:
          BACKEND_URL: http://127.0.0.1:8000
      - name: Install Playwright + chromium (for E2E)
        run: |
          pip install playwright==1.57.0
          playwright install --with-deps chromium
      - name: Run P6 E2E tests (Playwright)
        run: python tests/test_e2e.py
        env:
          BACKEND_URL: http://127.0.0.1:8000
      - name: Stop API
        if: always()
        run: kill $(cat /tmp/uvicorn.pid) 2>/dev/null || true

  docker:
    name: Docker (compose validate + build + nginx -t)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q
      - name: Build images
        run: docker compose build
      - name: nginx config syntax check (dans l'image frontend construite)
        run: docker compose run --no-deps --rm frontend nginx -t
