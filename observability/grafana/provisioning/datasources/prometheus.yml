# Provisionning datasource Grafana — déclare Prometheus (auto-chargé au démarrage).
# Le service `prometheus` est défini dans docker-compose.observability.yml.
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
