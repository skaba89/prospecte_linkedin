# Prometheus — scrape config RevPulse.
# Scrappe le backend FastAPI sur /metrics (exposé par app/metrics.py, P5).
# Les alertes sont définies dans alerts.yml (référencé via rule_files).
# À lancer via docker-compose.observability.yml (overlay) ; scrape le service `backend`.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "revpulse-monitor"

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: "revpulse-backend"
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: "revpulse-backend"
